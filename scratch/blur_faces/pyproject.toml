[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blur-faces"
version = "1.0.0"
description = "Blur faces in images using AWS Rekognition for privacy/anonymization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shane Orr"}
]
keywords = ["face", "blur", "privacy", "aws", "rekognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "boto3>=1.26.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "boto3-stubs[rekognition]>=1.26.0",
]

[project.scripts]
blur-faces = "blur_faces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blur_faces"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
